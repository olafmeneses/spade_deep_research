[project]
name = "spade-deep-research"
version = "1.0.0"
description = "Multi-agent deep research system built with SPADE."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Olaf Meneses", email = "99047173+olafmeneses@users.noreply.github.com" },
]
keywords = [
    "agents",
    "deep-research",
    "fastapi",
    "llm",
    "multi-agent",
    "spade",
]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "spade-llm[chroma]",
    "tavily>=1.1.0",
    "pypdf>=4.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp",
]

[project.urls]
Homepage = "https://github.com/olafmeneses/spade_deep_research"
Repository = "https://github.com/olafmeneses/spade_deep_research"
Issues = "https://github.com/olafmeneses/spade_deep_research/issues"


[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "httpx>=0.27",
    "aioresponses>=0.7",
]

[tool.uv.sources]
spade-llm = { git = "https://github.com/javipalanca/spade_llm.git", branch = "dev" }

[tool.uv]
override-dependencies = [
    "jinja2>=3.1.2",
    "litellm==1.80.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "timeout: per-test timeout marker (used by pytest-timeout when installed)",
]
